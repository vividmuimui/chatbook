<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- use-credentials: the deploy sits behind Cloudflare Access, and a manifest
         fetched without cookies is sent to the Access login instead (CORS fails,
         and the app is not installable). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#334155" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="chatbook" />
    <title>chatbook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/front/main.tsx"></script>
  </body>
</html>
