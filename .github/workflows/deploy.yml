name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

# Nothing here needs more than to read the code. Each job narrows it again.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The same checks a pull request gets. The deploy waits for them: a push that
  # breaks the tests or the build never reaches the Worker.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The token lives in this environment, not in the repository: only a job
    # that names it can read it, and the environment admits main alone
    # (Settings → Environments → production → Deployment branches).
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true

      # No Cloudflare token in this step's environment: install runs the
      # packages' own scripts, and none of them has any business with it.
      - name: Install dependencies
        run: vp install --frozen-lockfile

      # dist/chatbook/wrangler.json を作り直す。飛ばすと古い設定でマイグレーションとデプロイが走る
      - name: Build
        run: vp build

      # Before the deploy: new code on a D1 without its columns fails on every
      # book opened (CLAUDE.md「マイグレーションを当ててから動かす」).
      - name: Apply D1 migrations
        run: vp exec wrangler d1 migrations apply chatbook-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
